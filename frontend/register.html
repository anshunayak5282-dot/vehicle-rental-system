<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Apex Fleet Vehicle Rental</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-main);">

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px;">
    
    <div style="width: 100%; max-width: 550px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg);">
      
      <div style="text-align: center; margin-bottom: 26px;">
        <a href="index.html" class="logo-brand" style="justify-content: center; margin-bottom: 12px;">
          <div class="icon-badge">⚡</div>
          <span>APEX<span class="highlight">FLEET</span></span>
        </a>
        <h2 style="font-size: 1.6rem;">Join the Network</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Register as a Customer Renter</p>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Johnathan Doe" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+91 98201 01999" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="john@domain.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label>Driving License Number</label>
            <input type="text" id="regLicense" class="form-control" placeholder="MH-02-20220098432" required>
          </div>
        </div>

        <!-- Document Upload Simulation -->
        <div class="form-group">
          <label>Identity / KYC Proof Document</label>
          <div class="file-dropzone" onclick="simulateFileUpload()">
            <div class="icon">📁</div>
            <p id="uploadLabel">Click or drop Driving License, Aadhaar, or Indian Passport</p>
            <span style="font-size: 0.75rem; color: var(--text-muted);">PDF, PNG, JPG up to 10MB</span>
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px; margin-bottom: 20px;">
          Create My Account
        </button>
      </form>

      <div style="text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--accent-gold); font-weight: 600;">Sign in here</a>
      </div>

    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>

  <script>
    function simulateFileUpload() {
      document.getElementById('uploadLabel').innerHTML = '<strong style="color: var(--status-available);">✓ Document Attached: license_scan_verified.pdf</strong>';
      showToast('Document uploaded for driving verification.', 'info');
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const role = 'customer';
      const license_number = document.getElementById('regLicense').value.trim();
      const submitBtn = document.getElementById('regSubmitBtn');

      if (!name || name.length < 2) {
        showToast('Full name must be at least 2 characters.', 'error');
        return;
      }

      if (!email || !email.includes('@') || !email.includes('.')) {
        showToast('Please enter a valid email address.', 'error');
        return;
      }

      if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'error');
        return;
      }

      if (!license_number) {
        showToast('Please enter your driving license number.', 'error');
        return;
      }

      const origText = submitBtn ? submitBtn.innerHTML : 'Create My Account';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Creating Account...';
      }

      try {
        const res = await api.auth.register({ name, full_name: name, phone, email, password, role, license_number });
        if (res.success) {
          auth.setSession(res.token, res.user);
          const dbNotice = res.database ? ` [${res.database}]` : '';
          showToast(`Welcome to Apex Fleet, ${res.user.name}! Account registered successfully${dbNotice}.`, 'success');
          setTimeout(() => {
            window.location.href = 'pages/customer/dashboard.html';
          }, 800);
        } else {
          showToast(res.message || 'Registration failed', 'error');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = origText;
          }
        }
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
        }
      }
    }
  </script>
</body>
</html>
