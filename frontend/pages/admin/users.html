<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | Apex Fleet Admin</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Admin Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../../index.html" class="logo-brand">
          <div class="icon-badge">⚡</div>
          <span>APEX<span class="highlight">FLEET</span></span>
        </a>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-category">Governance</div>
        <a href="dashboard.html" class="menu-item">
          <span class="menu-icon">👑</span> Overview
        </a>
        <a href="users.html" class="menu-item active">
          <span class="menu-icon">👥</span> User Accounts
        </a>
        <a href="vehicles.html" class="menu-item">
          <span class="menu-icon">🚗</span> Fleet Management
        </a>
        <a href="bookings.html" class="menu-item">
          <span class="menu-icon">📑</span> All Bookings
        </a>
        <a href="reports.html" class="menu-item">
          <span class="menu-icon">📊</span> Reports & Finance
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-summary">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar js-user-avatar" alt="Admin">
          <div class="user-info-text">
            <span class="user-info-name js-user-name">Alexander Vance</span>
            <span class="user-info-role js-user-role">System Admin</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h2>User Accounts & Role Governance</h2>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openModal('createUserModal')">+ Create New User</button>
          <button class="btn btn-secondary btn-sm" onclick="auth.logout()">Sign Out</button>
        </div>
      </header>

      <div class="content-body">
        
        <!-- Filter Controls -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 16px; align-items: center;">
            <div>
              <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Search Users</label>
              <input type="text" id="userSearchInput" class="form-control" placeholder="Search by name, email or phone..." oninput="filterUsers()">
            </div>
            <div>
              <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Role Filter</label>
              <select id="userRoleFilter" class="form-control" onchange="filterUsers()">
                <option value="all">All Roles</option>
                <option value="admin">Admin</option>
                <option value="customer">Customer</option>
                <option value="manager">Rental Manager</option>
                <option value="driver">Driver</option>
              </select>
            </div>
            <div>
              <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Account Status</label>
              <select id="userStatusFilter" class="form-control" onchange="filterUsers()">
                <option value="all">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <div style="padding-top: 18px;">
              <button class="btn btn-secondary" onclick="resetUserFilter()">Reset</button>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="data-table-container">
          <div style="overflow-x: auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Contact Info</th>
                  <th>System Role</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <!-- Dynamically rendered -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create User Modal -->
  <div id="createUserModal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Create New User Account</h3>
        <button class="modal-close">&times;</button>
      </div>
      <form onsubmit="handleCreateUser(event)">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="newUserName" class="form-control" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="newUserEmail" class="form-control" placeholder="jane@apexrentals.com" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="newUserPhone" class="form-control" placeholder="+91 98201 55555" required>
            </div>
            <div class="form-group">
              <label>System Role (1 of 4)</label>
              <select id="newUserRole" class="form-control" required>
                <option value="customer">Customer</option>
                <option value="manager">Rental Manager</option>
                <option value="driver">Driver</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Initial Password</label>
            <input type="password" id="newUserPassword" class="form-control" placeholder="Enter secure password (min 6 chars)" autocomplete="new-password" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary js-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/common.js"></script>

  <script>
    let userList = [];

    document.addEventListener('DOMContentLoaded', () => {
      auth.guard(['admin']);
      loadUsers();
    });

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 24px;">Loading user records...</td></tr>`;

      try {
        const res = await api.users.getAll();
        userList = res.users || [];
        renderUsers(userList);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="color: var(--status-danger); text-align: center;">Error loading users.</td></tr>`;
      }
    }

    function renderUsers(list) {
      const tbody = document.getElementById('usersTableBody');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--text-muted);">No users match filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(u => {
        const roleColor =
          u.role === 'admin' ? 'badge-yellow' :
          u.role === 'customer' ? 'badge-blue' :
          u.role === 'owner' ? 'badge-purple' :
          u.role === 'manager' ? 'badge-green' : 'badge-yellow';
        const displayName = u.full_name || u.name || 'User';

        return `
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 12px;">
                <img src="${u.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;">
                <div>
                  <div style="font-weight: 600;">${displayName}</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">ID: #${u.id}</div>
                </div>
              </div>
            </td>
            <td>
              <div>${u.email}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${u.phone || 'N/A'}</div>
            </td>
            <td><span class="badge ${roleColor}" style="text-transform: capitalize;">${u.role}</span></td>
            <td>
              <span class="badge ${u.status === 'active' ? 'badge-green' : 'badge-red'}">${u.status}</span>
            </td>
            <td style="font-size: 0.85rem; color: var(--text-muted);">${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'Active'}</td>
            <td>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-sm" onclick="toggleUserStatus(${u.id}, '${u.status}')">
                  ${u.status === 'active' ? 'Deactivate' : 'Activate'}
                </button>
                <button class="btn btn-secondary btn-sm" onclick="deleteUserRecord(${u.id})" style="color: var(--status-danger);">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = document.getElementById('userSearchInput').value.toLowerCase();
      const role = document.getElementById('userRoleFilter').value;
      const status = document.getElementById('userStatusFilter').value;

      let filtered = [...userList];
      if (q) filtered = filtered.filter(u => (u.full_name || u.name || '').toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (u.phone && u.phone.includes(q)));
      if (role !== 'all') filtered = filtered.filter(u => u.role.toLowerCase() === role.toLowerCase());
      if (status !== 'all') filtered = filtered.filter(u => u.status === status);

      renderUsers(filtered);
    }

    function resetUserFilter() {
      document.getElementById('userSearchInput').value = '';
      document.getElementById('userRoleFilter').value = 'all';
      document.getElementById('userStatusFilter').value = 'all';
      renderUsers(userList);
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      const name = document.getElementById('newUserName').value.trim();
      const email = document.getElementById('newUserEmail').value.trim();
      const phone = document.getElementById('newUserPhone').value.trim();
      const role = document.getElementById('newUserRole').value;
      const password = document.getElementById('newUserPassword').value;

      try {
        await api.users.create({ name, full_name: name, email, phone, role, password, status: 'active' });
        closeModal('createUserModal');
        showToast(`User ${name} created successfully!`, 'success');
        loadUsers();
      } catch (err) {
        showToast(err.message || 'Error creating user', 'error');
      }
    }

    async function toggleUserStatus(id, currentStatus) {
      const nextStatus = currentStatus === 'active' ? 'inactive' : 'active';
      try {
        await api.users.update(id, { status: nextStatus });
        showToast(`User status updated to ${nextStatus}`, 'success');
        loadUsers();
      } catch (err) {
        showToast('Error updating status', 'error');
      }
    }

    async function deleteUserRecord(id) {
      if (!confirm('Are you sure you want to permanently delete this user?')) return;
      try {
        await api.users.delete(id);
        showToast('User record removed', 'info');
        loadUsers();
      } catch (err) {
        showToast('Error removing user', 'error');
      }
    }
  </script>
</body>
</html>
